name: TESTS

on:
  push:
    branches: ["master"]

permissions:
  contents: read

env:
  DB_PASSWORD: root
  MYSQL_USER: user
  DB_PORT: 3360
  DB_USER: root
  DB_HOST: '127.0.0.1'
  # DB_HOST: mysql
  PGSQL_HOST: '127.0.0.1'
  PGSQL_PORT: 5432
  PGSQL_USER: user
  PGSQL_PASSWORD: root

jobs:
  build:
    runs-on: ${{ matrix.operating-system }}

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    strategy:
      matrix:
        operating-system: [ubuntu-latest]
        # shivammathur/setup-php provisions PHP 5.3 the same way it does
        # every other version here (see wilkques/php-helper, wilkques/cache,
        # wilkques/config's own github-ci.yml, all of which already run 5.3
        # through this same action with no special-casing) — it ships
        # prebuilt binaries for versions this old rather than relying on the
        # runner's own package manager, and picks a Composer release that
        # still runs on that PHP version itself. No separate Docker-based job
        # is needed for it.
        php-versions: ['5.3', '5.4', '5.6', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3']

    steps:
      - name: PHP ${{ matrix.php-versions }} Test on ${{ matrix.operating-system }}
        uses: actions/checkout@v3

      # - name: List files in workspace
      #   run: ls -R ${{ github.workspace }}

      - name: Set up MySQL configuration
        run: |
          sudo cp tests/Drivers/MySql/my.cnf /etc/mysql/conf.d/my.cnf
          sudo chmod -R 644 /etc/mysql/conf.d/my.cnf

      - name: Mysql Version
        run: mysql --protocol=tcp -u ${{ env.DB_USER }} -p${{ env.DB_PASSWORD }} -e "SELECT VERSION();"

      - name: Create DB And User
        run: |
          mysql --protocol=tcp -u ${{ env.DB_USER }} -p${{ env.DB_PASSWORD }} < tests/Drivers/MySql/docker-entrypoint-initdb.d/createdb.sql

      - name: Check DB And User
        run: |
          mysql --protocol=tcp -u ${{ env.DB_USER }} -p${{ env.DB_PASSWORD }} -e "SHOW DATABASES;"
          mysql --protocol=tcp -u ${{ env.DB_USER }} -p${{ env.DB_PASSWORD }} -e "SHOW GRANTS FOR 'user'@'%';"

      - name: Wait for MySQL to be ready
        run: |
          until mysqladmin ping -h${{ env.DB_HOST }} --silent; do
            echo "Waiting for database connection..."
            sleep 1
          done

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h ${{ env.PGSQL_HOST }} -p ${{ env.PGSQL_PORT }}; do
            echo "Waiting for database connection..."
            sleep 1
          done

      - name: Create DB And User (PostgreSQL)
        run: |
          PGPASSWORD=root psql -h ${{ env.PGSQL_HOST }} -p ${{ env.PGSQL_PORT }} -U postgres -f tests/Drivers/PostgreSql/docker-entrypoint-initdb.d/createdb.sql

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring,pdo,pdo_mysql,pdo_pgsql,intl #optional
          ini-values: "post_max_size=256M" #optional

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-versions }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --dev

      # Add a test script to composer.json, for instance: "test": "vendor/bin/phpunit"
      # Docs: https://getcomposer.org/doc/articles/scripts.md

      - name: Set Config
        run: cp tests/config.php.example tests/config.php

      - name: Fix File Permissions
        run: chmod +x tests/phpunit

      - name: Run test
        run: tests/phpunit
